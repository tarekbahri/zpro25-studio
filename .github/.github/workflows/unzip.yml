name: Auto Unzip
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and Clean
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o "*.zip"
            rm -f *.zip
            git config user.name "bot"
            git config user.email "bot@github.com"
            git add .
            git commit -m "Unzipped files"
            git push
          fi
